version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: routeai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routeai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-routeai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: routeai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://routeai:routeai_secret@postgres:5432/routeai_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-secret}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: routeai-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
